name: TMN status check
on:
  push:
    branches: [main]
    paths: ["market/trigger-diag.txt"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/diag/tmn_status.py && python3 scripts/diag/tmn_onchain.py
      - run: |
          git config user.name "ditoman-bot"; git config user.email "ditoman-bot@users.noreply.github.com"
          git add market/tmn-status.json market/tmn-onchain.json; git commit -m "TMN status check" || true
          git pull --rebase origin main; git push origin HEAD:main
