name: Wikipedia fact fetch
on:
  push:
    branches: [main]
    paths: ["scripts/wiki/**"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  wiki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/wiki/fetch.py
      - run: |
          git config user.name "ditoman-bot"; git config user.email "ditoman-bot@users.noreply.github.com"
          git add data/iran/wiki || true; git commit -m "Wikipedia fetch" || exit 0
          git pull --rebase origin main; git push origin HEAD:main
