name: One-off spelling fix on channel
permissions:
  contents: write
  actions: read
on:
  push:
    branches: [main]
    paths: [".github/scripts/fix_spelling_files.txt"]
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - env:
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID || '@Ditoman_tm' }}
        run: python3 .github/scripts/fix_spelling_live.py
      - run: |
          git config user.name "ditoman-bot"
          git config user.email "ditoman-bot@users.noreply.github.com"
          git add market/spelling-fix-result-2.json
          git commit -m "Spelling fix result" || true
          git pull --rebase origin main; git push origin HEAD:main
