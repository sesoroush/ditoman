name: Backfill price history

# One-off / manual full backfill of market/series/*.json (the nightly report keeps them updated).
on:
  push:
    branches: [main]
    paths:
      - "market/trigger-history.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/history.py --full
      - run: |
          git config user.name "ditoman-bot"
          git config user.email "ditoman-bot@users.noreply.github.com"
          git add market/series
          git commit -m "Price history backfill $(date -u +%Y-%m-%d)" || echo "no change"
          git pull --rebase origin main
          git push origin HEAD:main
