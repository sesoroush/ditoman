name: Fetch IMI-100 ranking
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  imi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install "playwright>=1.55" && python -m playwright install --with-deps chromium
      - run: python3 scripts/imi/fetch.py || true
      - run: |
          git config user.name "ditoman-bot"; git config user.email "ditoman-bot@users.noreply.github.com"
          git add data/iran/imi || true; git commit -m "IMI-100 ranking fetch" || exit 0
          git pull --rebase origin main; git push origin HEAD:main
