name: Post to Telegram

# Posts every NEW file added under telegram/ (not telegram/drafts/) to the channel.
# Post file format:
#   optional first line:  image: some-image.png   (a file on ditoman.com, shown as a large preview)
#   or:                   images: a.png, b.png, c.png   (sent together as an album, text follows)
#                    or:  video-first: https://...  (the link's video preview shown above the text)
#   everything after it:  the message text (plain text, up to 4096 characters)
#
# Required repo secret:   TELEGRAM_BOT_TOKEN
# Optional repo variable: TELEGRAM_CHAT_ID  (defaults to @Ditoman_tm)

permissions:
  contents: write

on:
  push:
    branches: [main]
    paths:
      - "telegram/*.md"
  workflow_dispatch:
    inputs:
      file:
        description: "Post file to send, e.g. telegram/drafts/welcome.md"
        required: true
      delete:
        description: "Optional: message ids to delete first (comma separated), e.g. a post whose video failed"
        required: false
        default: ""

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out which posts to send
        id: files
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "${{ github.event.inputs.file }}" > files.txt
          else
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              BEFORE="$(git rev-list --max-parents=0 HEAD | tail -1)"
            fi
            git diff --no-renames --name-only --diff-filter=A "$BEFORE" "${{ github.sha }}" -- 'telegram/*.md' > files.txt
          fi
          echo "Posts to send:"; cat files.txt

      - name: Send to Telegram
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID || '@Ditoman_tm' }}
        run: |
          # Accept the secret even if extra text was pasted around the token.
          TOKEN="$(printf '%s' "$TOKEN" | grep -oE '[0-9]{6,}:[A-Za-z0-9_-]{30,}' | head -n 1)"
          if [ -z "$TOKEN" ]; then
            echo "TELEGRAM_BOT_TOKEN secret is missing or not a valid bot token." >&2
            exit 1
          fi
          DEL="${{ github.event.inputs.delete }}"
          for id in $(echo "$DEL" | tr ',' ' '); do
            curl -sS -X POST "https://api.telegram.org/bot${TOKEN}/deleteMessage" -d "chat_id=$CHAT_ID" -d "message_id=$id" | jq '{ok, description}'
          done
          # Find a mirror URL whose page really exposes the video, so Telegram can show it above the text.
          pick_video() {
            u="$1"; id="$(echo "$u" | grep -oE '/(reel|p|tv)/[A-Za-z0-9_-]+' | head -n 1)"
            [ -z "$id" ] && { echo "$u"; return; }
            for cand in "$u" "https://www.kkinstagram.com${id}/" "https://kkinstagram.com${id}/" "https://vxinstagram.com${id}/" "https://www.instagramez.com${id}/"; do
              # On a resend, skip the exact URL Telegram already cached without a preview.
              if [ -n "$DEL" ] && [ "$cand" = "$u" ]; then continue; fi
              for try in 1 2; do
                page="$(curl -sL -m 25 -A 'TelegramBot (like TwitterBot)' "$cand" || true)"
                if echo "$page" | grep -qiE 'property="og:video|name="twitter:player:stream'; then echo "$cand"; return; fi
                sleep 5
              done
              echo "No video found at $cand" >&2
            done
            echo "$u"
          }
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            [ -f "$f" ] || { echo "Missing $f" >&2; exit 1; }
            first="$(head -n 1 "$f")"
            image=""
            images=""
            video=""
            if echo "$first" | grep -q '^video-first:'; then
              video="$(echo "$first" | sed 's/^video-first:[[:space:]]*//')"
              text="$(tail -n +2 "$f" | sed '/./,$!d')"
            elif echo "$first" | grep -q '^images:'; then
              images="$(echo "$first" | sed 's/^images:[[:space:]]*//')"
              text="$(tail -n +2 "$f" | sed '/./,$!d')"
            elif echo "$first" | grep -q '^image:'; then
              image="$(echo "$first" | sed 's/^image:[[:space:]]*//')"
              text="$(tail -n +2 "$f" | sed '/./,$!d')"
            else
              text="$(cat "$f")"
            fi
            # **bold** markers -> real Telegram bold (entities), markers removed from the text.
            printf '%s' "$text" > /tmp/post.txt
            conv="$(python3 scripts/tg_bold.py /tmp/post.txt)"
            text="$(printf '%s' "$conv" | jq -r .text)"
            ents="$(printf '%s' "$conv" | jq -c .entities)"
            send() { # $1 = API method, rest = curl args
              m="$1"; shift
              resp="$(curl -sS -X POST "https://api.telegram.org/bot${TOKEN}/$m" "$@")"
              echo "$resp" | jq '{ok, description, message_id: .result.message_id}'
              echo "$resp" | jq -e '.ok' > /dev/null || exit 1
            }
            echo "Sending $f"
            if [ -n "$video" ]; then
              video="$(pick_video "$video")"
              echo "Video preview from: $video"
              # Video preview above the text.
              payload="$(jq -n --arg c "$CHAT_ID" --arg t "$text" --arg u "$video" --argjson e "$ents" '{chat_id:$c, text:$t, entities:$e, link_preview_options:{url:$u, prefer_large_media:true, show_above_text:true}}')"
              send sendMessage -H 'Content-Type: application/json' -d "$payload"
            elif [ -n "$images" ]; then
              # Album: several photos sent together (comma-separated list), then the text under them.
              args=(); media="[]"; i=0
              IFS=',' read -ra arr <<< "$images"
              for im in "${arr[@]}"; do
                im="$(echo "$im" | xargs)"
                [ -f "$im" ] || { echo "Missing image $im" >&2; exit 1; }
                args+=(-F "p$i=@$im")
                media="$(echo "$media" | jq -c --arg m "attach://p$i" '. + [{type:"photo", media:$m}]')"
                i=$((i+1))
              done
              send_album() {
                resp="$(curl -sS -X POST "https://api.telegram.org/bot${TOKEN}/sendMediaGroup" --form-string "chat_id=$CHAT_ID" --form-string "media=$media" "${args[@]}")"
                echo "$resp" | jq '{ok, description, message_ids: [.result[]?.message_id]}'
                echo "$resp" | jq -e '.ok' > /dev/null || exit 1
              }
              send_album
              payload="$(jq -n --arg c "$CHAT_ID" --arg t "$text" --argjson e "$ents" '{chat_id:$c, text:$t, entities:$e, link_preview_options:{is_disabled:true}}')"
              send sendMessage -H 'Content-Type: application/json' -d "$payload"
            elif [ -n "$image" ]; then
              # Upload the image itself as a real photo (tap to open/save), straight from the repo.
              [ -f "$image" ] || { echo "Missing image $image" >&2; exit 1; }
              if [ "$(LC_ALL=C.UTF-8 printf '%s' "$text" | LC_ALL=C.UTF-8 wc -m)" -le 1000 ]; then
                send sendPhoto --form-string "chat_id=$CHAT_ID" -F "photo=@$image" --form-string "caption=$text" --form-string "caption_entities=$ents"
              else
                # Too long for a photo caption: photo first, then the full text right under it.
                send sendPhoto --form-string "chat_id=$CHAT_ID" -F "photo=@$image"
                payload="$(jq -n --arg c "$CHAT_ID" --arg t "$text" --argjson e "$ents" '{chat_id:$c, text:$t, entities:$e, link_preview_options:{is_disabled:true}}')"
                send sendMessage -H 'Content-Type: application/json' -d "$payload"
              fi
            else
              payload="$(jq -n --arg c "$CHAT_ID" --arg t "$text" --argjson e "$ents" '{chat_id:$c, text:$t, entities:$e}')"
              send sendMessage -H 'Content-Type: application/json' -d "$payload"
            fi
          done < files.txt

      - name: Update website feed
        if: always()
        run: |
          python3 scripts/build_feed.py
          git config user.name "ditoman-bot"
          git config user.email "ditoman-bot@users.noreply.github.com"
          git add telegram/feed.json
          git commit -m "Update posts feed" || echo "no change"
          git pull --rebase origin main
          git push origin HEAD:main
