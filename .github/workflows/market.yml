name: Fetch market prices

# Fetches prices and commits market/latest.json back to the repo.
# Triggered by editing market/trigger.txt (and later on a daily schedule).
on:
  push:
    branches: [main]
    paths:
      - "market/trigger.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch prices
        run: python scripts/fetch_prices.py
      - name: Commit result
        run: |
          git config user.name "ditoman-bot"
          git config user.email "ditoman-bot@users.noreply.github.com"
          git add market/latest.json
          git commit -m "Market prices $(date -u +%Y-%m-%dT%H:%MZ)" || echo "no change"
          git pull --rebase origin main
          git push origin HEAD:main
